<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0B1220"/>
<stop offset="100%" stop-color="#111827"/>
</linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#60A5FA"/>
<stop offset="100%" stop-color="#8B5CF6"/>
</linearGradient>
</defs>
<rect width="512" height="512" rx="96" fill="url(#bg)"/>
<!-- gum blob / sticky base -->
<ellipse cx="256" cy="330" rx="140" ry="60" fill="url(#acc)" opacity="0.25"/>
<!-- lobster claw (gum-sticky claw) -->
<g fill="none" stroke="url(#acc)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
<path d="M256 150 C 200 150 176 190 176 240 C 176 290 210 330 256 330 C 302 330 336 290 336 240 C 336 190 312 150 256 150 Z"/>
<path d="M206 230 C 200 205 208 185 226 172"/>
<path d="M306 230 C 312 205 304 185 286 172"/>
</g>
<!-- sticky drip lines from claw -->
<g stroke="url(#acc)" stroke-width="10" stroke-linecap="round" opacity="0.7">
<line x1="206" y1="300" x2="196" y2="350"/>
<line x1="306" y1="300" x2="316" y2="350"/>
<line x1="256" y1="315" x2="256" y2="368"/>
</g>
<!-- code brackets -->
<text x="256" y="420" text-anchor="middle" font-family="monospace" font-size="30" fill="#8B94A7" font-weight="bold">&lt;CTO/&gt;</text>
<!-- status dot -->
<circle cx="404" cy="108" r="18" fill="#34D399"/>
<text x="404" y="114" text-anchor="middle" font-family="monospace" font-size="18" fill="#04121F" font-weight="bold">✓</text>
</svg>