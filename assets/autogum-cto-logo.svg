<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0B1220"/>
<stop offset="100%" stop-color="#111827"/>
</linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#60A5FA"/>
<stop offset="100%" stop-color="#8B5CF6"/>
</linearGradient>
</defs>
<rect width="512" height="512" rx="96" fill="url(#bg)"/>

<!-- antennae -->
<g stroke="url(#acc)" stroke-width="8" stroke-linecap="round">
  <path d="M196 120 Q 170 70 130 60"/>
  <path d="M316 120 Q 342 70 382 60"/>
</g>
<circle cx="130" cy="58" r="9" fill="url(#acc)"/>
<circle cx="382" cy="58" r="9" fill="url(#acc)"/>

<!-- lobster body/head (oval, sideways) -->
<ellipse cx="256" cy="200" rx="88" ry="66" fill="url(#acc)" opacity="0.35"/>

<!-- two big pincer claws (crab/lobster style) -->
<g fill="none" stroke="url(#acc)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
  <!-- left pincer -->
  <path d="M178 180 C 120 150 96 196 118 236 C 130 258 158 258 168 240 C 178 222 172 196 178 180 Z"/>
  <path d="M118 236 C 108 260 118 276 136 274"/>
  <!-- right pincer -->
  <path d="M334 180 C 392 150 416 196 394 236 C 382 258 354 258 344 240 C 334 222 340 196 334 180 Z"/>
  <path d="M394 236 C 404 260 394 276 376 274"/>
</g>

<!-- eyes (not smile — two dots) -->
<circle cx="218" cy="196" r="10" fill="#E8ECF4"/>
<circle cx="294" cy="196" r="10" fill="#E8ECF4"/>
<circle cx="221" cy="192" r="4" fill="#0B1220"/>
<circle cx="297" cy="192" r="4" fill="#0B1220"/>

<!-- tail curl (lobster tail, right side bottom) -->
<path d="M340 250 C 380 250 396 280 380 306 C 366 328 336 326 328 306 C 322 290 330 276 340 250 Z" fill="url(#acc)" opacity="0.55"/>

<!-- gum drip puddle (sticky base) -->
<path d="M96 330 Q 96 420 256 420 Q 416 420 416 330 Q 416 372 360 384 Q 280 402 256 402 Q 232 402 152 384 Q 96 372 96 330 Z" fill="url(#acc)" opacity="0.9"/>

<!-- sticky drip strands -->
<g stroke="url(#acc)" stroke-width="10" stroke-linecap="round" opacity="0.85">
<line x1="170" y1="360" x2="156" y2="404"/>
<line x1="256" y1="380" x2="256" y2="424"/>
<line x1="342" y1="360" x2="356" y2="404"/>
</g>
<circle cx="156" cy="412" r="7" fill="url(#acc)"/>
<circle cx="256" cy="432" r="7" fill="url(#acc)"/>
<circle cx="356" cy="412" r="7" fill="url(#acc)"/>

<!-- green cursor bar (stuck-on-task) -->
<rect x="88" y="140" width="10" height="80" rx="5" fill="#34D399" opacity="0.9"/>

<!-- name -->
<text x="256" y="470" text-anchor="middle" font-family="monospace" font-size="26" fill="#E8ECF4" font-weight="bold">AUTO_GUM_CTO</text>
</svg>
