name = "autogum-cto"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# KV for message counters + session memory
[[kv_namespaces]]
binding = "AUTOGUM"
id = "11f3b6ffcef641d78e46a74d92a77b3b"

# Variables
[vars]
GUMROAD_PRODUCT_URL = ""

# Secrets (set with `wrangler secret put <name>`):
#   CONCENTRATE_API_KEY — LLM provider key (api.concentrate.ai)
#   AGENT_API_TOKEN     — Bearer token required for /api/agent + /api/audit
#   PAYWALL_MODE        — set to "real" on the hosted instance to enable credits

# Production: attach custom domain later (autogum-cto.com)
